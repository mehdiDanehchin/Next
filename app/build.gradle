plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    // Generates Firebase resources (google_app_id, default_web_client_id, ...)
    // from app/google-services.json. Keep that file out of version control
    // (see .gitignore) — it contains project-specific configuration keys.
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.next'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.next"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // Material components (needed for XML theme reference)
    implementation libs.material

    // Kotlin
    implementation libs.core.ktx

    // Splash Screen (AndroidX)
    implementation libs.core.splashscreen

    // Compose BOM - controls all Compose library versions
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    debugImplementation libs.compose.ui.tooling

    // Activity Compose
    implementation libs.activity.compose

    // Lifecycle
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose

    // Navigation Compose
    implementation libs.navigation.compose

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // DataStore
    implementation libs.datastore.preferences

    // SavedStateHandle helpers
    implementation libs.lifecycle.viewmodel.savedstate

    // Coil for image loading in Compose
    implementation libs.coil.compose

    // Firebase (BoM pins compatible versions of all Firebase libraries)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    // Credential Manager + Sign in with Google (modern account-credential flow)
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid

    // Firebase Task -> coroutines .await()
    implementation libs.kotlinx.coroutines.play.services

    // Testing
    testImplementation libs.junit
    // org.json is an Android runtime class; JVM unit tests need the real JVM
    // implementation to exercise the pending_ops payload codec.
    testImplementation "org.json:json:20240303"
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
